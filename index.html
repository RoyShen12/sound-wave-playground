<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Sound Wave Playground - 音频可视化与分析系统</title>
    <link rel="stylesheet" href="/src/styles.css">
  </head>
  <body>
    <!-- 初始化覆盖层 -->
    <div class="init-overlay" id="initOverlay">
      <div class="init-title">Sound Wave Playground</div>
      <div class="init-subtitle">基于 Web Audio API 的音频可视化与分析系统</div>
      <div class="init-pulse">&#9835;</div>
      <div class="init-hint">点击任意位置初始化音频引擎</div>
    </div>

    <div class="app-container">
      <!-- 顶部导航栏 -->
      <header class="app-header">
        <div class="app-logo">
          <div class="app-logo-icon">&#9835;</div>
          <span>SWP</span>
        </div>

        <nav class="tab-nav">
          <button class="tab-btn active" data-tab="oscillator">振荡器</button>
          <button class="tab-btn" data-tab="microphone">麦克风</button>
        </nav>

        <div class="toolbar">
          <button class="toolbar-btn play-btn" id="toggleSound" title="播放/暂停">&#9654;</button>
          <div class="toolbar-divider"></div>
          <button class="toolbar-btn" id="tb_fz" title="冻结波形">&#10074;&#10074;</button>
        </div>
      </header>

      <!-- 主内容区域 -->
      <div class="main-content">
        <!-- 振荡器页面 -->
        <div class="tab-page active" id="page-oscillator">
          <!-- 侧边栏控制面板 -->
          <aside class="control-panel" id="controlPanel">
            <!-- 振荡器控制区域由 JS 动态生成 -->
          </aside>

          <!-- 可视化区域 -->
          <div class="visualization-area">
            <!-- 时域图 -->
            <div class="canvas-container">
              <div class="canvas-header">
                <span class="canvas-title">时域波形 (Time Domain)</span>
                <div class="canvas-controls">
                  <button class="small-btn draw-mode-btn" data-mode="0">点</button>
                  <button class="small-btn draw-mode-btn" data-mode="1">面</button>
                  <button class="small-btn draw-mode-btn active" data-mode="2">波</button>
                  <select id="spsv" style="width: auto; min-width: 100px;" title="每帧采样次数"></select>
                </div>
              </div>
              <div class="canvas-wrapper">
                <canvas id="main"></canvas>
              </div>
            </div>

            <!-- 频域图 -->
            <div class="canvas-container">
              <div class="canvas-header">
                <span class="canvas-title">频域分析 (Frequency Domain)</span>
                <div class="canvas-controls">
                  <span id="thdValue" style="font-family: var(--font-mono); font-size: 0.75rem; color: var(--accent-secondary);"></span>
                </div>
              </div>
              <div class="canvas-wrapper">
                <canvas id="sub"></canvas>
              </div>
            </div>
          </div>
        </div>

        <!-- 麦克风页面 -->
        <div class="tab-page" id="page-microphone">
          <aside class="control-panel">
            <div class="panel-section">
              <div class="panel-section-header">
                <span class="panel-section-title">麦克风输入</span>
              </div>
              <div class="panel-section-content">
                <p style="color: var(--text-secondary); font-size: 0.8rem;">
                  切换到此标签页后，点击页面以启用麦克风输入。
                </p>
                <div id="micStatus" style="margin-top: var(--spacing-sm); font-family: var(--font-mono); font-size: 0.8rem;"></div>
              </div>
            </div>
          </aside>
          <div class="visualization-area mic-page">
            <div class="canvas-container" style="flex: 1; min-width: 400px;">
              <div class="canvas-header">
                <span class="canvas-title">左声道 (Left Channel)</span>
              </div>
              <div class="canvas-wrapper">
                <canvas id="micMain" width="800" height="400"></canvas>
              </div>
            </div>
            <div class="canvas-container" style="flex: 1; min-width: 400px;">
              <div class="canvas-header">
                <span class="canvas-title">右声道 (Right Channel)</span>
              </div>
              <div class="canvas-wrapper">
                <canvas id="micSub" width="800" height="400"></canvas>
              </div>
            </div>
            <div class="canvas-container" style="flex: 1; min-width: 400px;">
              <div class="canvas-header">
                <span class="canvas-title">频域分析 (Frequency)</span>
              </div>
              <div class="canvas-wrapper">
                <canvas id="micFreq" width="800" height="400"></canvas>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 状态栏 -->
      <footer class="status-bar">
        <div class="status-info">
          <div class="status-item">
            <span class="status-dot inactive" id="statusDot"></span>
            <span id="statusText">等待初始化</span>
          </div>
          <div class="status-item" id="sampleRateInfo"></div>
          <div class="status-item" id="processorInfo"></div>
        </div>
        <span>Sound Wave Playground v1.0</span>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
